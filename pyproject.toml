[project]
name = "mlops-edge-demo"
version = "0.1.0"
description = "Edge PC demo: YOLO detection on a video, connected to the MLOps Central Platform Edge Fleet"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zer0", email = "osom8979@gmail.com" }]
dependencies = [
    # edge: 임베드 런타임(로컬 큐/하트비트/명령/업로더/로컬 API)
    # gpu:  하트비트에 NVIDIA 사용률 포함 (GPU 가 없으면 None 으로 보고)
    # yolo: Central 에서 배포된 YOLO 모델을 런타임이 직접 로드
    # 0.3.0 부터 frames collector 가 SDK 에 내장된다.
    "geo-mlops-sdk[edge,gpu,yolo]>=0.3.0",
    "opencv-python>=4.8",
]

[project.scripts]
mlops-edge-demo = "mlops_edge_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_edge_demo"]
